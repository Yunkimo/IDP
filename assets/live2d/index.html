<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Live2D 桌宠</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script>
    // 提前捕获库脚本的加载/执行错误（诊断用）
    window.__earlyErrors = [];
    window.onerror = function (msg, src, line, col, err) {
      window.__earlyErrors.push(String(msg) + ' @ ' + src + ':' + line);
      return false;
    };
    // cubism4.min.js 是 Rollup 打包产物，会引用 process.env.NODE_ENV；浏览器里需补齐
    window.process = window.process || { env: { NODE_ENV: 'production' } };
  </script>
  <script src="live2dcubismcore.min.js"></script>
  <script src="pixi.min.js"></script>
  <script src="cubism4.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
